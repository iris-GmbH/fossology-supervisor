[unix_http_server]
file=/run/fossology/supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
pidfile=/run/fossology/supervisord.pid
logfile=/dev/stdout
logfile_maxbytes=0
childlogdir=/var/log/fossology

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/fossology/supervisor.sock

[include]
files=/etc/supervisor/conf.d/*.conf
